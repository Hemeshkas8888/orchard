# iPad Pro (10.5-inch, Cellular) (J208): identity from public sources
# (tools/catalog/generate). RAM sessions are recorded in docs/bring-up/j208.md; not in the build yet.
schema = 1
kind = "hardware.device"

[device]
profile = "j208"
name = "iPad Pro (10.5-inch, Cellular)"
apple_products = ["iPad7,4"]
